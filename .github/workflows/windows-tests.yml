name: Windows regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: AgentPet tests on Windows
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify Node SQLite
        run: node -e "const db = new (require('node:sqlite').DatabaseSync)(':memory:'); db.close();"

      - name: Run all regression tests
        run: node test/run-all.mjs
